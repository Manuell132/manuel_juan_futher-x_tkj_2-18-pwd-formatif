<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulir Kontak</title>
    <style>
      body {
        background-color: aliceblue;
        font-family: Arial, Helvetica, sans-serif;
      }

      #contact {
        padding: 40px 20px;
      }

      .contact-form {
        background-color: white;
        width: 400px;
        margin: auto;
        padding: 24px;
        border: 1px solid black;
        border-radius: 15px;
      }

      .contact-form h2 {
        text-align: center;
        color: darkblue;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid grey;
        border-radius: 5px;
      }

      .form-group textarea {
        resize: none;
        border-radius: 10px;
      }

      .form-group input:focus {
        background-color: #e0eaff;
        border: 2px solid darkblue;
        outline: none;
      }

      .form-group textarea:focus {
        border: 2px solid darkred;
        outline: none;
      }

      .btn-submit {
        background-color: rgb(0, 0, 221);
        color: white;
        font-weight: bold;
        border-radius: 5px;
        padding: 10px 20px;
      }

      .btn-submit:hover {
        background-color: rgb(0, 0, 138);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form action="" class="contact-form">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="name">Nama</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea name="message" id="message" rows="5" required></textarea>
        </div>
        <button class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
  </body>
</html>
