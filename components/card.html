<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Proyek</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: aliceblue;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        background-color: white;
        width: 320px;
        padding: 20px;
        border: 2px solid black;
        margin: 30px auto 30px auto;
        border-radius: 10px;
      }

      .card img {
        width: 100%;
        height: 160px;
        display: block;
      }

      .card h3 {
        color: darkblue;
        margin-bottom: 8px;
      }

      .card p,
      .card a {
        font-size: 15px;
      }

      .card a {
        color: darkgoldenrod;
      }

      footer {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!--
    Lebar kartu tanpa mengatur box-sizing adalah:
    320px (lebar konten) + 20px (lebar padding kiri) + 20px (lebar
    padding kanan) + 2px (ukuran border) = 362px
    
    Dengan adanya "box-sizing: border-box;", lebar kartu secara
    keseluruhan, termasuk konten padding kiri-kanan serta ukuran
    border, tepan 320px
     -->
    <main>
      <div class="card">
        <img
          src="./../assets/images/card/project-image.png"
          alt="Gambar Proyek"
        />
        <h3>Website Tes Tombol</h3>
        <p>
          Mencoba membuat tombol sederhana dengan menggunakan HTML dan CSS.
          Tujuannya adalah untuk belajar pembuatan tombol yang interaktif dan
          menarik dengan CSS.
        </p>
        <a>Lihat Proyek</a>
      </div>
    </main>
    <footer>
      <a href="./../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
