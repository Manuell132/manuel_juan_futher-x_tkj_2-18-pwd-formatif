<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kumpulan Tombol</title>
    <style>
      body {
        background-color: aliceblue;
        font-family: Arial, sans-serif;
      }

      h2 {
        color: black;
        font-size: 20px;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
      }

      .btn:hover {
        cursor: pointer;
      }

      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .btn-primary,
      .btn-send {
        color: white;
      }

      .btn secondary,
      .btn-outline {
        color: black;
      }

      .btn-primary {
        background-color: blue;
      }

      .btn-primary:hover {
        background-color: darkblue;
      }

      .btn-secondary {
        background-color: #65ffdb;
      }

      .btn-secondary:hover {
        background-color: #1ed5aa;
      }

      .btn-outline {
        background-color: rgb(255, 255, 255);
        border: 2px solid black;
      }

      .btn-outline:hover {
        background-color: rgb(225, 225, 225);
      }

      .btn-send {
        background-color: rgba(113, 53, 0, 0.844);
      }

      .btn-send:hover {
        background-color: rgba(86, 40, 0, 0.942);
      }
    </style>
  </head>

  <body>
    <main>
      <h2>Kumpulan Tombol</h2>
      <div class="button-group">
        <a class="btn btn-primary">Lihat Proyek</a>
        <a class="btn btn-secondary">Unduh CV</a>
        <a class="btn btn-outline">Hubungi Saya</a>
        <a class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>

    <footer>
      <a href="./../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
